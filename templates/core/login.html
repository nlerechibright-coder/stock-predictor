{% extends "core/base.html" %}
{% block title %}Login | Stock Predictor{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-card p-8 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-2xl font-bold text-white text-center mb-6">Sign In to Your Account</h2>
        
        <form method="POST" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label for="id_username" class="block text-sm font-medium text-slate-300 mb-1">Username</label>
                <input type="text" name="username" id="id_username" required 
                       class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2 text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            
            <div>
                <label for="id_password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <input type="password" name="password" id="id_password" required 
                       class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2 text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            
            <button type="submit" class="w-full bg-primary hover:bg-sky-600 text-white font-bold py-2 px-4 rounded-lg transition">
                Sign In
            </button>
        </form>
        
        <p class="text-center text-slate-400 text-sm mt-6">
            Don't have an account? 
            <a href="#" class="text-primary hover:text-sky-400">Contact your administrator</a>
        </p>
    </div>
</div>
{% endblock %}
